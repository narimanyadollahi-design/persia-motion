<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>saz detail story</title>
<style>
/*FONTS*/
:root{--paper:#F3EBDD;--ink:#2A1A12;--acc:#C8963E;--gray:#D9CBB3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#000}
body{font-family:V,Tahoma,sans-serif}
.stage{position:relative;width:720px;height:1280px;overflow:hidden}
.sc{position:absolute;inset:0;background:var(--bg);color:var(--fg);--bg:var(--paper);--fg:var(--ink);overflow:hidden}
.sc.dark{--bg:var(--ink);--fg:var(--paper)}
.abs{position:absolute}
.mono{font-family:Consolas,"Courier New",monospace;direction:ltr;letter-spacing:.06em}
.hud{position:absolute;font-family:Consolas,monospace;direction:ltr;font-size:15px;letter-spacing:.08em;font-weight:700;opacity:.55;top:48px}
.hl{position:absolute;right:48px;top:128px;width:624px;font-weight:800;font-size:56px;line-height:1.38;text-align:right;z-index:6}
.hl .ln{display:block;white-space:nowrap}
.hl .w{display:inline-block;margin-left:.22em;opacity:0}
u{text-decoration:none;color:var(--acc)}
.sub{position:absolute;left:36px;right:36px;top:1110px;display:flex;flex-wrap:wrap;gap:0 13px;font-weight:800;font-size:36px;line-height:1.5;direction:rtl;z-index:8}
.sub span{opacity:0}
.tl{position:absolute;left:48px;right:48px;top:1060px;height:3px;background:currentColor;opacity:.15}
.tlf{position:absolute;left:48px;top:1060px;height:3px;background:var(--acc)}
.card{position:absolute;background:#FBF7EF;border-radius:20px;box-shadow:0 24px 60px rgba(42,26,18,.18);border:1px solid rgba(42,26,18,.08)}
.dark .card{background:#3A271C;border-color:#4d3626;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.chip{display:inline-block;padding:10px 22px;border-radius:999px;font-weight:800;font-size:24px}
.vf i{position:absolute;width:44px;height:44px;border-color:var(--acc);border-style:solid}
.vf .a{left:0;top:0;border-width:4px 0 0 4px}.vf .b{right:0;top:0;border-width:4px 4px 0 0}
.vf .c{left:0;bottom:0;border-width:0 0 4px 4px}.vf .d{right:0;bottom:0;border-width:0 4px 4px 0}
svg{overflow:visible}
</style>
</head>
<body>
<!-- shared SVG library: instrument, macro detail, textures -->
<svg width="0" height="0" style="position:absolute">
 <defs>
  <linearGradient id="woodG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5530"/><stop offset=".55" stop-color="#6e3519"/><stop offset="1" stop-color="#4a220f"/></linearGradient>
  <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf6ec"/><stop offset=".35" stop-color="#d5e9ea"/><stop offset=".65" stop-color="#eadcf2"/><stop offset="1" stop-color="#f6ecd6"/></linearGradient>
  <linearGradient id="str" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d8a84"/><stop offset=".5" stop-color="#f4f1ea"/><stop offset="1" stop-color="#8d8a84"/></linearGradient>
  <filter id="wood" x="0" y="0" width="1" height="1">
   <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.07" numOctaves="4" seed="8" result="n"/>
   <feDiffuseLighting in="n" surfaceScale="7" lighting-color="#ffe7c2" result="lit"><feDistantLight id="sun" azimuth="250" elevation="55"/></feDiffuseLighting>
   <feBlend in="lit" in2="SourceGraphic" mode="multiply"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
  <!-- the instrument (tar), drawn in a 200x600 box -->
  <g id="tar">
   <rect x="92" y="6" width="16" height="70" rx="5" fill="#4a220f"/>
   <g fill="#e9dcc0"><circle cx="86" cy="22" r="6"/><circle cx="114" cy="22" r="6"/><circle cx="86" cy="46" r="6"/><circle cx="114" cy="46" r="6"/></g>
   <rect x="90" y="70" width="20" height="270" fill="url(#woodG)"/>
   <rect x="92" y="78" width="3" height="255" fill="url(#pearl)"/><rect x="105" y="78" width="3" height="255" fill="url(#pearl)"/>
   <ellipse cx="100" cy="368" rx="50" ry="54" fill="url(#woodG)"/>
   <ellipse cx="100" cy="482" rx="76" ry="96" fill="url(#woodG)"/>
   <ellipse cx="100" cy="368" rx="34" ry="36" fill="#e9dcc0"/>
   <ellipse cx="100" cy="490" rx="56" ry="70" fill="#efe4cb"/>
   <path d="M60 418 Q100 404 140 418" stroke="url(#pearl)" stroke-width="7" fill="none"/>
   <rect x="84" y="520" width="32" height="7" rx="2" fill="#f7efe0" stroke="#6e3519" stroke-width="1"/>
   <g stroke="#cfc8ba" stroke-width="1.2"><line x1="96" y1="20" x2="96" y2="560"/><line x1="100" y1="20" x2="100" y2="560"/><line x1="104" y1="20" x2="104" y2="560"/></g>
  </g>
  <!-- macro detail: wood grain + mother-of-pearl inlay band + bridge + three strings (720x720) -->
  <g id="macro">
   <rect x="-40" y="-40" width="800" height="800" fill="#7a3f22" filter="url(#wood)"/>
   <g transform="rotate(-18 360 360)">
    <rect x="-200" y="300" width="1120" height="128" fill="#3c1c0c"/>
    <g id="inlay"></g>
    <rect x="-200" y="296" width="1120" height="6" fill="#d8b46a"/><rect x="-200" y="426" width="1120" height="6" fill="#d8b46a"/>
   </g>
   <rect x="250" y="520" width="230" height="44" rx="8" fill="#f4ead6" stroke="#5a2e15" stroke-width="3"/>
   <g fill="#5a2e15"><rect x="318" y="518" width="8" height="10"/><rect x="361" y="518" width="8" height="10"/><rect x="404" y="518" width="8" height="10"/></g>
   <g stroke="url(#str)" stroke-width="5" id="strings"><line x1="322" y1="-40" x2="322" y2="760"/><line x1="365" y1="-40" x2="365" y2="760"/><line x1="408" y1="-40" x2="408" y2="760"/></g>
   <rect id="gloss" x="-300" y="-40" width="180" height="800" fill="#fff" opacity=".10" transform="skewX(-18)"/>
  </g>
 </defs>
</svg>
<div class="stage" id="stage"></div>
<script>
const TIM=/*TIMING*/null;
const PROJECT=/*PROJECT*/null;
const B=PROJECT.brand,C=PROJECT.copy;
Object.entries(B.colors).forEach(([k,v])=>document.documentElement.style.setProperty("--"+k,v));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),e5=x=>1-Math.pow(1-x,5);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
const GAP=.4,S=[];let acc=.5;TIM.forEach(l=>{S.push(acc);acc+=l.dur+GAP});
const END=S[6]+TIM[6].dur+.35,DUR=END+2.7;
const W=(i,k)=>TIM[i].words[Math.min(k,TIM[i].words.length-1)].s;
const CSTART=[...S,END];
window.SFX=[];CSTART.forEach((t,i)=>{if(i)SFX.push({t:t-.06,k:"whoosh"})});
// inlay pattern (khatam-like triangles)
(function(){let s="";for(let i=-12;i<64;i++){const x=i*24;const up=i%2===0;
 s+=`<path d="M${x} ${up?412:316} L${x+12} ${up?316:412} L${x+24} ${up?412:316} Z" fill="${["url(#pearl)","#e8d9b8","#cfe2e2"][((i%3)+3)%3]}" stroke="#2a1206" stroke-width="1.4"/>`;
 s+=`<circle cx="${x+12}" cy="364" r="4" fill="#d8b46a"/>`}document.getElementById("inlay").innerHTML=s})();
const stage=$("stage");const scenes=[];
const H=lines=>`<div class="hl">${lines.map(l=>`<span class="ln">${l.split(" ").map(w=>`<span class="w">${w.replace(/\*(.*?)\*/g,"<u>$1</u>")}</span>`).join("")}</span>`).join("")}</div>`;
function mk(i,cls,html){
 const el=document.createElement("div");el.className="sc "+cls;el.style.zIndex=i+1;
 el.innerHTML=`<div class="hud" style="left:48px">${B.hud}</div><div class="hud" style="right:48px">${B.chapters[i]}</div><div class="tl"></div><div class="tlf"></div>`+html;
 stage.appendChild(el);
 const sc={el,i,hl:[...el.querySelectorAll(".hl .w")],tlf:el.querySelector(".tlf")};
 if(i<7){const sub=document.createElement("div");sub.className="sub";sub.innerHTML=TIM[i].words.map(w=>`<span>${w.w}</span>`).join("");el.appendChild(sub);sc.sub=[...sub.children]}
 scenes.push(sc);return sc;
}
const tarSVG=(w,extra="")=>`<svg viewBox="0 0 200 600" style="width:${w}px;height:${w*3}px" ${extra}><use href="#tar"/></svg>`;
const vf=(id,style)=>`<div class="vf abs" id="${id}" style="${style}"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>`;

// S0 hook: six identical full-instrument photos
mk(0,"",`${H(C.s0.h)}
<div class="abs" id="g0" style="left:40px;right:40px;top:400px;height:560px">${[0,1,2,3,4,5].map(n=>`<div class="card g0c" style="left:${(n%3)*220}px;top:${((n/3)|0)*284}px;width:200px;height:264px;overflow:hidden"><div class="abs" style="left:68px;top:14px">${tarSVG(64)}</div></div>`).join("")}</div>
<div class="abs" id="bub0" style="left:150px;top:760px;z-index:7"><div style="background:var(--ink);color:var(--paper);font-weight:800;font-size:38px;padding:18px 34px;border-radius:30px 30px 30px 6px">${C.s0.quote}</div></div>`);
// S1 problem: handmade = factory in a full shot; the hidden details
mk(1,"dark",`${H(C.s1.h)}
<div class="card abs" id="c1a" style="right:48px;top:380px;width:270px;height:430px;overflow:hidden"><div class="abs" style="left:85px;top:20px">${tarSVG(100)}</div><div class="abs" style="right:0;left:0;bottom:0;padding:14px 18px;font-weight:800;font-size:24px;background:rgba(0,0,0,.25)">${C.s1.cardA}</div></div>
<div class="card abs" id="c1b" style="left:48px;top:380px;width:270px;height:430px;overflow:hidden"><div class="abs" style="left:85px;top:20px">${tarSVG(100)}</div><div class="abs" style="right:0;left:0;bottom:0;padding:14px 18px;font-weight:800;font-size:24px;background:rgba(0,0,0,.25)">${C.s1.cardB}</div></div>
<div class="abs" id="eq1" style="left:330px;top:540px;width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--ink);font-weight:800;font-size:44px;text-align:center;line-height:58px;z-index:3">=</div>
<div class="abs" id="hid1" style="right:48px;left:48px;top:850px;text-align:right"><div style="font-size:22px;opacity:.6;margin-bottom:14px">${C.s1.hiddenLabel}</div>${C.s1.details.map(d=>`<span class="chip d1" style="border:2px dashed var(--acc);color:var(--paper);margin:0 0 10px 10px">${d}</span>`).join("")}</div>`);
// S2 fix: viewfinder closes on the inlay, zoom-through into the detail
mk(2,"",`${H(C.s2.h)}
<div class="abs" id="z2" style="left:0;top:0;width:720px;height:1280px;transform-origin:360px 744px">
 <div class="abs" style="left:240px;top:330px">${tarSVG(240)}</div>
 <div class="abs" id="mac2" style="left:296px;top:686px;width:128px;height:116px;border-radius:6px;overflow:hidden;opacity:0"><svg viewBox="200 260 320 290" style="width:128px;height:116px"><use href="#macro"/></svg></div>
</div>
${vf("vf2","left:40px;top:330px;width:640px;height:720px;z-index:5")}
<div class="abs" style="left:0;right:0;top:980px;text-align:center;z-index:5" id="ch2">${C.s2.chips.map(c=>`<span class="chip" style="background:var(--ink);color:var(--paper);margin:0 6px">${c}</span>`).join("")}</div>`);
// S3 how: macro, focus pull, prompt card fills, raking light
mk(3,"dark",`<div class="abs" id="mac3" style="left:0;top:0;width:720px;height:1280px"><svg viewBox="0 0 720 720" preserveAspectRatio="xMidYMid slice" style="width:720px;height:1280px"><use href="#macro"/></svg></div>
<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(42,26,18,.92) 0,rgba(42,26,18,.25) 30%,rgba(42,26,18,.2) 55%,rgba(42,26,18,.95) 84%)"></div>
${H(C.s3.h)}
${vf("vf3","left:110px;top:360px;width:500px;height:330px;z-index:4")}
<div class="abs mono" id="ro3" style="left:118px;top:700px;font-size:18px;color:var(--acc);z-index:4">100mm · f/4 · AF ●</div>
<div class="card abs" id="pc3" style="left:48px;right:48px;top:760px;height:270px;background:var(--paper);color:var(--ink);z-index:6;padding:22px 26px">
 <div style="font-size:20px;opacity:.6;margin-bottom:8px">${C.s3.window}</div>
 ${C.s3.rows.map((r,n)=>`<div class="r3" style="display:flex;align-items:center;gap:14px;height:62px;border-top:1px solid rgba(42,26,18,.1)"><span class="ck" style="width:34px;height:34px;border-radius:50%;border:2px solid var(--acc);display:inline-block;flex:none;text-align:center;line-height:30px;font-size:20px;color:#fff">✓</span><b style="font-size:24px;flex:none">${r[0]}</b><span class="rv" style="font-size:24px;white-space:nowrap;overflow:hidden">${r[1]}</span></div>`).join("")}
</div>`);
// S4 negative prompt: cross out the full instrument, crop to the detail
mk(4,"dark",`<div class="abs" id="mac4" style="left:0;top:0;width:720px;height:1280px"><svg viewBox="0 0 720 720" preserveAspectRatio="xMidYMid slice" style="width:720px;height:1280px"><use href="#macro"/></svg></div>
<div class="abs" id="dim4" style="inset:0;background:rgba(42,26,18,.86)"></div>
${H(C.s4.h)}
<div class="abs" id="th4" style="left:250px;top:390px;width:220px;height:470px;z-index:3"><div class="card" style="inset:0;position:absolute;overflow:hidden"><div class="abs" style="left:70px;top:10px">${tarSVG(80)}</div></div>
 <svg class="abs" viewBox="0 0 220 470" style="left:0;top:0;width:220px;height:470px;z-index:4"><path id="x4a" d="M20 20 L200 450" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="500" stroke-dashoffset="500"/><path id="x4b" d="M200 20 L20 450" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="500" stroke-dashoffset="500"/></svg></div>
${vf("vf4","left:220px;top:370px;width:280px;height:510px;z-index:5")}
<div class="abs" id="neg4" style="left:48px;right:48px;top:920px;z-index:6;text-align:center"><span style="display:inline-block;background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 22px;font-size:26px"><span class="mono" id="ty4" style="font-weight:700"></span></span></div>`);
// S5 payoff: quality stamp lands before the price tag
mk(5,"",`${H(C.s5.h)}
<div class="card abs" id="ph5" style="left:70px;top:390px;width:580px;height:560px;overflow:hidden;padding:0"><svg viewBox="40 40 640 620" preserveAspectRatio="xMidYMid slice" style="width:580px;height:560px"><use href="#macro"/></svg></div>
<div class="abs" id="st5" style="right:86px;top:420px;z-index:5;width:170px;height:170px;border-radius:50%;border:6px solid var(--acc);color:var(--acc);background:rgba(243,235,221,.92);font-weight:800;font-size:34px;text-align:center;line-height:1.2;padding-top:44px">${C.s5.stamp}<br>✓</div>
<div class="abs" id="tag5" style="left:110px;top:820px;z-index:5;transform-origin:20px 0"><div style="background:var(--ink);color:var(--paper);padding:16px 30px 16px 26px;border-radius:12px 40px 40px 12px;font-weight:800;font-size:30px">${C.s5.tag} <span style="filter:blur(6px)">۰۰۰٬۰۰۰</span></div></div>`);
// S6 generalize: a loupe moves across craft textures, then fills the frame
mk(6,"dark",`${H(C.s6.h)}
<svg class="abs" id="lens6" viewBox="0 0 720 1280" style="left:0;top:0;width:720px;height:1280px">
 <defs>
  <g id="strip">
   <rect x="40" y="430" width="200" height="420" rx="18" fill="#7a3f22" filter="url(#wood)"/>
   <g transform="translate(260,430)"><rect width="200" height="420" rx="18" fill="#3c1c0c"/><svg x="0" y="0" width="200" height="420" viewBox="300 260 200 420" preserveAspectRatio="xMidYMid slice" style="overflow:hidden"><use href="#macro"/></svg></g>
   <rect x="480" y="430" width="200" height="420" rx="18" fill="#5a1d10"/><rect x="480" y="430" width="200" height="420" rx="18" fill="url(#lac)"/>
  </g>
  <linearGradient id="lac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset=".56" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="lc"><circle id="lcc" cx="140" cy="640" r="110"/></clipPath>
 </defs>
 <use href="#strip" opacity=".55"/>
 <g clip-path="url(#lc)"><rect width="720" height="1280" fill="var(--ink)"/><use href="#strip" id="zoomStrip"/></g>
 <circle id="ring6" cx="140" cy="640" r="110" fill="none" stroke="var(--acc)" stroke-width="10"/>
 <line id="hdl6" x1="218" y1="718" x2="300" y2="800" stroke="var(--acc)" stroke-width="18" stroke-linecap="round"/>
</svg>
<div class="abs" style="left:40px;right:40px;top:870px;display:flex;justify-content:space-between;font-size:22px;opacity:.7;z-index:4" id="lab6">${C.s6.labels.slice().reverse().map(l=>`<span style="width:200px;text-align:center">${l}</span>`).join("")}</div>`);
// End card
mk(7,"",`<div class="abs" id="mo7" style="left:50%;top:290px;margin-left:-140px;width:280px;height:280px;border-radius:50%;border:6px solid var(--acc);color:var(--ink);font-size:140px;font-weight:800;text-align:center;line-height:268px;overflow:hidden;box-shadow:0 20px 50px rgba(42,26,18,.25)">${B.photo?`<img src="${B.photo}" style="width:100%;height:100%;object-fit:cover;display:block">`:B.monogram}</div>
<div class="abs" id="n7" style="left:0;right:0;top:620px;text-align:center;font-weight:800;font-size:58px">${B.name_fa}</div>
<div class="abs" id="d7" style="left:0;right:0;top:710px;text-align:center;font-size:30px;opacity:.65">${B.tagline}</div>
<div class="abs" id="c7" style="left:0;right:0;top:830px;text-align:center"><span class="chip" style="background:var(--ink);color:var(--paper);font-size:30px;padding:14px 32px">${C.end}</span></div>`);

// SFX clicks
[0,1,2].forEach(n=>SFX.push({t:S[3]+W(3,[0,2,4][n])+.05,k:"click"}));
SFX.push({t:S[4]+W(4,4),k:"click"},{t:S[5]+W(5,4),k:"click"},{t:S[2]+W(2,5),k:"click"});

const origin=[[360,640],[300,790],[360,570],[360,744],[360,640],[360,640],[360,700],[140,640]];
function seek(T){
 // raking light: light azimuth sweeps during "light" line, otherwise slow drift
 const sweep=P(T,S[3]+W(3,4)-.2,S[3]+W(3,4)+1.4);
 $("sun").setAttribute("azimuth",String(250-150*eio(sweep)+10*Math.sin(T*.3)));
 $("sun").setAttribute("elevation",String(55-37*eio(sweep)));
 $("gloss").setAttribute("x",String(-300+P(T,S[5],S[5]+3)*1300));
 scenes.forEach((sc,i)=>{
  const st=CSTART[i];
  if(i===0){sc.el.style.display="block"}
  else{
   if(T<st-.12){sc.el.style.display="none";return}
   sc.el.style.display="block";
   if(i===3||i===4){ // continuous macro: crossfade, no wipe
    const u=P(T,st-.1,st+.35);sc.el.style.opacity=u;sc.el.style.clipPath="none";
   } else {
    const r=e5(P(T,st-.1,st+.6))*1600;sc.el.style.opacity=1;
    sc.el.style.clipPath=r>=1599?"none":`circle(${r}px at ${origin[i][0]}px ${origin[i][1]}px)`;
   }
  }
  const lt=T-st;
  sc.tlf.style.width=(clamp(T/DUR)*624)+"px";
  sc.hl.forEach((w,k)=>{const u=e5(P(lt,.05+k*.09,.5+k*.09));w.style.opacity=u;w.style.transform=`translateY(${(1-u)*30}px)`;w.style.filter=`blur(${(1-u)*6}px)`});
  if(sc.sub)TIM[i].words.forEach((w,k)=>{const el=sc.sub[k];el.style.opacity=P(lt,w.s-.03,w.s+.12);el.style.color=(lt>=w.s&&lt<w.e+.08)?"var(--acc)":"inherit"});
 });
 let lt;
 // S0
 lt=T-S[0];
 document.querySelectorAll(".g0c").forEach((c,n)=>{const u=eb(P(lt,.3+n*.1,.8+n*.1));c.style.opacity=clamp(u*1.4);c.style.transform=`scale(${.75+.25*u})`});
 const b0=eb(P(lt,W(0,4)-.1,W(0,4)+.4));$("bub0").style.transform=`scale(${b0})`;$("bub0").style.opacity=clamp(b0*2);$("bub0").style.transformOrigin="0 100%";
 // S1
 lt=T-S[1];
 const a1=e5(P(lt,.1,.7));$("c1a").style.transform=`translateX(${(1-a1)*120}px)`;$("c1a").style.opacity=a1;
 $("c1b").style.transform=`translateX(${(1-a1)*-120}px)`;$("c1b").style.opacity=a1;
 const e1=eb(P(lt,W(1,7)-.1,W(1,7)+.3));$("eq1").style.transform=`scale(${e1*(1+.08*Math.sin(lt*8)*P(lt,1.5,2))})`;
